# CI Pipeline — X1 Frifas Bot
# Roda pytest nos PRs e pushs para main.
# Falha antes de chegar no Railway se algum teste quebrar.

name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Rodar testes unitários
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Rodar testes
        run: |
          cd tests
          python -m pytest . -v --tb=short

      - name: Resumo dos resultados
        if: always()
        run: |
          echo "✅ Testes finalizados — veja o output acima para detalhes"
